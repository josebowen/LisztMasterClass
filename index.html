<style>:root{--bg:#17110b;--paper:#f3e6cc;--ink:#2a1c0e;--mute:#b9a98c;--gold:#e0b25a;--line:rgba(224,178,90,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% 30%,#3a2a19,#17110b 70%);color:var(--paper);font:17px/1.45 Inter,system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
h1,h2,h3,.q{font-family:Fraunces,Georgia,serif}h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;cursor:pointer;color:var(--paper);background:rgba(40,28,16,.9);border:1px solid var(--line);border-radius:999px;padding:8px 16px}
button:hover,button:focus-visible{border-color:var(--gold);outline:none}
#top{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(20,14,8,.7)}
#top h1{font-size:24px;white-space:nowrap}#top h1 span{font-weight:400;font-style:italic;color:var(--mute);font-size:18px;margin-left:6px}
#topics{display:flex;gap:8px;flex:1;flex-wrap:wrap;justify-content:center}
#topics button{font-size:17px;padding:9px 18px}#topics button[aria-pressed=true]{background:var(--gold);color:#22160a;border-color:var(--gold);font-weight:600}
#stage{position:relative;display:flex;justify-content:center;align-items:stretch;gap:18px;padding:14px 20px;min-height:0}
.wall{display:flex;flex-direction:column;justify-content:space-around;align-items:center;width:150px;flex:none}
.med{background:none;border:0;padding:0;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--paper);transition:transform .35s}
.med .pic{height:min(112px,10.5vh);aspect-ratio:104/124;width:auto;border-radius:50%;border:4px solid #7b5a2c;box-shadow:0 0 0 2px #2b1c0c,0 8px 18px #000a;background:#4b3520 center 20%/cover;filter:sepia(.9) contrast(1.05);display:grid;place-items:center;font:600 34px Fraunces,serif;color:#e9d6ad}
.med span{font-size:13px;line-height:1.1;color:var(--mute)}.med.on .pic{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 28px #e0b25a99}.med.on span{color:var(--gold)}
.med.playing{transform:scale(1.28)}.med.dim,.face.dim{opacity:.45}
#photoWrap{flex:0 1 auto;height:100%;aspect-ratio:1600/1122;max-width:calc(100% - 340px);align-self:center;max-height:100%}
#photo{position:relative;width:100%;height:100%;border:6px solid #6d4f27;box-shadow:0 0 0 2px #2b1c0c,0 18px 50px #000c;background:#2a1d10;overflow:hidden}
#group{width:100%;height:100%;object-fit:cover;filter:sepia(1) saturate(.75) contrast(1.08) brightness(.92);display:block}
.face{position:absolute;width:11%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:none;border:2px solid transparent;padding:0}
.face b{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:500 13px Inter,sans-serif;background:rgba(20,14,8,.85);border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap;margin-top:2px}
.face.on{border-color:var(--gold);box-shadow:0 0 0 3px #e0b25a55,0 0 30px #e0b25acc}.face.on b{color:var(--gold);border-color:var(--gold)}
.face:hover{border-color:var(--line)}
#tail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#tailLine{stroke:var(--gold);stroke-width:2.5;stroke-dasharray:2 7;stroke-linecap:round}
#bubble{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(720px,calc(100% - 420px));background:var(--paper);color:var(--ink);border-radius:22px;padding:18px 24px 14px;box-shadow:0 14px 40px #000b;border:3px solid #fff5}
#bubble.liszt{background:linear-gradient(#f0cd82,#e0b25a);border-color:#fff3}
#bubble .tag{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;opacity:.75}
#bubble .q{font-size:25px;line-height:1.32;margin:6px 0 8px}#bubble .q.long{font-size:21px}
#bubble .cite{font-size:14px;opacity:.8}#bubble .note{font-size:15px;margin-top:6px}
#bubble .row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
#bubble button{background:#2a1c0e;color:var(--paper);border-color:#2a1c0e;padding:6px 14px;font-size:15px}#bubble button.alt{background:transparent;color:var(--ink);border-color:#2a1c0e66}
#bubble .count{font-size:14px;opacity:.7;margin-left:auto}
#piano{position:relative;padding:0 20px 12px}
#keys{height:16px;margin:0 6%;border-radius:3px 3px 0 0;background:repeating-linear-gradient(90deg,#efe6d2 0 15px,#8c8271 15px 16px);position:relative}
#keys:after{content:"";position:absolute;inset:0 0 6px;background:repeating-linear-gradient(90deg,transparent 0 11px,#15100b 11px 20px,transparent 20px 27px,#15100b 27px 36px,transparent 36px 59px,#15100b 59px 68px,transparent 68px 75px,#15100b 75px 84px,transparent 84px 91px,#15100b 91px 100px,transparent 100px 112px)}
#lid{background:linear-gradient(#1d150e,#0b0806);border:1px solid #3b2a17;border-radius:0 0 26px 26px;box-shadow:inset 0 2px 0 #5a4326,0 10px 30px #000a;padding:8px 22px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 20px;align-items:center}
.lidlabel{grid-column:1/-1;font-size:13px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
#discs{display:flex;gap:14px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}#discs::-webkit-scrollbar{display:none}
.disc{background:none;border:0;border-radius:0;padding:0;display:flex;align-items:center;gap:10px;text-align:left;color:var(--paper);flex:none}
.disc i{width:62px;height:62px;border-radius:50%;flex:none;background:radial-gradient(circle,#1a120b 0 5%,var(--lab,#8a2a22) 6% 34%,#000 35%),#000;background:radial-gradient(circle,#1a120b 0 5%,var(--lab,#8a2a22) 6% 34%,transparent 35%),repeating-radial-gradient(circle,#0a0a0a 0 2px,#262626 2px 3px);box-shadow:0 4px 10px #000c,inset 0 0 0 1px #444}
.disc b{display:block;font:600 16px Fraunces,serif}.disc{max-width:215px}.disc span{font-size:13px;color:var(--mute);display:block}
.disc.on i{animation:spin 1.8s linear infinite;box-shadow:0 0 0 2px var(--gold),0 0 22px #e0b25aaa}.disc.on b{color:var(--gold)}.disc.paused i{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
#now{display:flex;align-items:center;gap:12px;justify-content:flex-end}#nowText{font-size:14px;color:var(--mute);max-width:230px}#bars{width:120px;height:44px}
#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:9;padding:20px}
#modal .card{background:#20170e;border:1px solid var(--line);border-radius:18px;max-width:760px;max-height:88vh;overflow:auto;padding:28px 32px;position:relative}
#modal h2{font-size:30px;margin-bottom:6px}#modal h3{color:var(--gold);font-size:19px;margin:18px 0 4px}#modal p{margin:0}#modal a{color:var(--gold)}#modal ul{padding-left:20px}#modal li{margin:6px 0}
#closeModal{position:sticky;top:0;float:right}#modal .primary{background:var(--gold);color:#22160a;border-color:var(--gold);font-weight:600;margin-top:18px;font-size:18px;padding:10px 22px}
.hidden{display:none!important}
@media (max-width:900px){body{overflow:auto;display:block}#top{flex-wrap:wrap;gap:8px;padding:10px 12px}#top h1{font-size:19px}#top h1 span{display:none}#aboutBtn{margin-left:auto;font-size:13px;padding:5px 10px}#topics{order:3;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%}#topics button{font-size:15px;padding:7px 13px;flex:none}
#stage{display:block;padding:10px 12px}#photoWrap{max-width:none;width:100%;height:auto}.wall{flex-direction:row;width:auto;justify-content:space-between;margin-top:10px}#wallL{float:none}.med .pic{width:64px;height:76px;font-size:22px;border-width:3px}.med span{font-size:11px}.med.playing{transform:scale(1.12)}
.face b{font-size:10px;padding:0 5px}#tail{display:none}#bubble{position:static;transform:none;width:auto;margin-top:12px;padding:14px 16px}#bubble .q{font-size:20px}#bubble .q.long{font-size:18px}
#piano{padding:0 12px 16px}#lid{grid-template-columns:1fr}#now{justify-content:flex-start}.disc i{width:56px;height:56px}}
@media (prefers-reduced-motion:reduce){.disc.on i{animation:none}.med{transition:none}}
</style>

<script>(()=>{var L=e=>"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(e),M={src:L("Liszt and his students.jpg")+"?width=1600",page:"https://commons.wikimedia.org/wiki/File:Liszt_and_his_students.jpg"},h={liszt:{name:"Franz Liszt",short:"Liszt",at:[52.4,33.5],bio:"1811-1886. He taught in Weimar three afternoons a week and took no fee."},siloti:{name:"Alexander Siloti",short:"Siloti",at:[23,42],bio:"1863-1945. Pupil in Weimar, 1883-86. Front row, second from left."},friedheim:{name:"Arthur Friedheim",short:"Friedheim",at:[43.7,46],bio:"1859-1932. Pupil in Weimar in the 1880s. Front row, third from left."},lamond:{name:"Frederic Lamond",short:"Lamond",img:L("Lamond 1898.jpg")+"?width=400",page:"https://commons.wikimedia.org/wiki/File:Lamond_1898.jpg",bio:"1868-1948. Pupil in Weimar, 1885-86. Recorded from 1919."},dalbert:{name:"Eugen d\u2019Albert",short:"d\u2019Albert",img:L("D'albert2.jpg")+"?width=400",page:"https://commons.wikimedia.org/wiki/File:D'albert2.jpg",bio:"1864-1932. Pupil in Weimar from 1882. Recorded for Odeon in 1912."},fay:{name:"Amy Fay",short:"Amy Fay",img:L("AMY KAY.jpg")+"?width=400",page:"https://commons.wikimedia.org/wiki/File:AMY_KAY.jpg",bio:"1844-1928. American pupil in Weimar, 1873."},mason:{name:"William Mason",short:"Mason",img:L("William Mason.png")+"?width=400",page:"https://commons.wikimedia.org/wiki/File:William_Mason.png",bio:"1829-1908. American pupil in Weimar in the 1850s."},lachmund:{name:"Carl Lachmund",short:"Lachmund",img:"img/lachmund.jpg",bio:"1857-1928. American pupil in Weimar, 1882-84. Kept a diary."},gollerich:{name:"August G\xF6llerich",short:"G\xF6llerich",bio:"1859-1923. Pupil and secretary in Liszt\u2019s last years. Kept a diary of the classes, 1884-86."},bagby:{name:"Albert Morris Bagby",short:"Bagby",bio:"American pupil in Weimar."},riesberg:{name:"F. W. Riesberg",short:"Riesberg",bio:"1863-1950. American pupil in Weimar in the mid-1880s."},others:{name:"Other witnesses",short:"Others",bio:"Pupils and visitors quoted once."}},S={left:["lamond","dalbert","fay","mason"],right:["lachmund","gollerich","bagby","riesberg","others"]},a=(e,t,o,s,d,p)=>({by:e,who:t,text:o,cite:s,note:d,disc:p}),u=[{id:"soul",label:"Soul before technique",quotes:[a("liszt","siloti","I take no payment from you but, if I did, there is no money which could give you the right to come and wash your dirty linen here. I am not a washerwoman. Go to the conservatorium, that is the place for you.","Siloti, Memories of Liszt, 21"),a("friedheim","friedheim","Interpretation was the thing. The inner meaning of the composition must be found, the spirit must be brought out.","Friedheim, Life and Liszt, 52"),a("lamond","lamond","The poetical vision always arose before his mental eye, whether it was a Beethoven Sonata, a Chopin nocturne, or a work of his own.","Lamond, Memoirs; Bowen, note 183"),a("liszt","lachmund","Do not look at the ivory; show yourself superior to that.","Lachmund, Living with Liszt, 51")]},{id:"images",label:"He spoke in images",quotes:[a("liszt","fay","Keep your hand still, Fr\xE4ulein; don\u2019t make omelette.","Fay, Music-Study in Germany, 223"),a("liszt","lamond","I don\u2019t want to listen to how fast you can play octaves. What I wish to hear is the canter of the horses of the Polish cavalry before they gather force and destroy the enemy.","Lamond, Memoirs, 68","On the left-hand octaves in Chopin\u2019s Polonaise in A flat, Op. 53."),a("lachmund","lachmund","Much of his teaching was by symbolism, by gesture, or even by grimace.","Lachmund, Living with Liszt, 48"),a("siloti","siloti","No one else in the world could show musical phrasing as he did, merely by the expression of his face.","Siloti, Memories of Liszt, 17")]},{id:"beethoven",label:"Beethoven",quotes:[a("liszt","siloti","Dear child, this piece may not be brought to me; I do not allow it to be played, because in my youth it was my hobbyhorse. But since \u201Cwe\u201D are in a good mood today, I will play the sonata for you.","Siloti, \u201CMeine Erinnerungen an Franz Liszt\u201D (1913), translated for this demo","The \u201CMoonlight\u201D Sonata. Siloti had just praised Anton Rubinstein\u2019s playing of it.","moon1"),a("siloti","siloti","When, after four bars, the G sharp entered in the right hand, I understood nothing any more. He did not bring this G sharp out, but it was a tone unknown to me, which I still hear clearly now, after 27 years.","Siloti, \u201CMeine Erinnerungen\u201D (1913), translated for this demo","The room was small and carpeted, 35 to 40 people were in it, and the grand was worn and out of tune.","moon1"),a("siloti","siloti","He played the whole first movement, then the second; the third he only began, and said that he was too old and did not have enough physical strength to play this movement.","Siloti, \u201CMeine Erinnerungen\u201D (1913), translated for this demo",null,"moon3"),a("fay","fay","Perhaps it is because he feels obliged to be conscientious in teaching Beethoven!","Fay, Music-Study in Germany (1883 printing), 238","Fay on why pupils rarely dared bring him a Beethoven sonata."),a("fay","fay","He always teaches Beethoven with notes which shows how scrupulous he is about him for, of course, he knows all the sonatas by heart. He has B\xFClow\u2019s edition, which he opens and lays in the end of the grand piano.","Fay, Music-Study in Germany, as quoted in Bowen, draft chapter \u201CLiszt and the New Style\u201D"),a("liszt","gollerich","This piece, like scarcely any other, is a remarkable example of how precisely the unique Beethoven indicated everything. Three or four different markings are found in every bar. Not as in Bach.","G\xF6llerich, diary of the master classes, as quoted in Bowen, draft chapter; page not given there","In a class where Rosenthal played Liszt\u2019s transcription of the Scherzo from the Ninth Symphony."),a("lachmund","lachmund","Someone wanted to play something by Bach or Beethoven, Liszt became deeply serious.","Lachmund, as quoted in Bowen, draft chapter; page not given there","Lachmund adds that Liszt followed the score when either was played."),a("liszt","others","Must be played without much nuance.","Quoted in Bowen, draft chapter; source not given there","On the opening of Beethoven\u2019s Piano Concerto in G major."),a("liszt","others","No! No! No! We know that. Come again and bring something new.","Otis Boise; Bowen, note 126","To a pupil who brought Beethoven\u2019s Violin Sonata, Op. 24."),a("lamond","lamond","The poetical vision always arose before his mental eye, whether it was a Beethoven Sonata, a Chopin nocturne, or a work of his own.","Lamond, Memoirs; Bowen, note 183")]},{id:"chopin",label:"Chopin",quotes:[a("liszt","lamond","I don\u2019t want to listen to how fast you can play octaves. What I wish to hear is the canter of the horses of the Polish cavalry before they gather force and destroy the enemy.","Lamond, Memoirs, 68","Polonaise in A flat, Op. 53."),a("liszt","bagby","I play that well myself.","Bagby, \u201CA Summer with Liszt in Weimar,\u201D 663","On finding the Etude in A flat, Op. 25 No. 1, on the pile. He sat down and played it."),a("liszt","siloti","Conservatorium-fashion.","Siloti, Memories of Liszt, 18","His name for Chopin played with the small notes too fast. Siloti says it irritated him.","waltz"),a("liszt","friedheim","The Governess Scherzo.","Friedheim and Siloti; Bowen, note 125","His name for the Scherzo in B flat minor, one of three pieces pupils were told not to bring.")]},{id:"freedom",label:"Your own conception",quotes:[a("fay","fay","Liszt\u2019s grand principle is, to leave you your freedom, and when you play to him, you feel like a Pegasus caracoling about in the air.","Fay, Music-Study in Germany, 273"),a("fay","fay","He doesn\u2019t keep nagging at you all the time, but he leaves you your own conception.","Fay, Music-Study in Germany, 213"),a("liszt","mason","Don\u2019t play it that way. Play it like this.","Mason, Memories of
